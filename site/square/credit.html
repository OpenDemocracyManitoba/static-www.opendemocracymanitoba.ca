<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Validator</title>
<!-- Import Tailwind CSS from CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script>
  // Function to check if the credit card number is valid using the Luhn algorithm
  function validCreditCard(value) {
    // Remove all whitespaces from the input value
    value = value.replace(/\s+/g, '');
    
    // Check if the input is empty or contains any non-digit characters
    if (!value || /[^0-9]+/.test(value)) {
        return false;
    }

    let nCheck = 0, bEven = false;
    for (var n = value.length - 1; n >= 0; n--) {
        var cDigit = value.charAt(n),
            nDigit = parseInt(cDigit, 10);
        if (bEven && (nDigit *= 2) > 9) nDigit -= 9;
        nCheck += nDigit;
        bEven = !bEven;
    }

    return (nCheck % 10) === 0;
  }

  // Function to check if the expiry date is in the future
  function validExpiry(expiry) {
    const [month, year] = expiry.split('/');
    const expiryDate = new Date(`20${year}`, month - 1);
    const currentDate = new Date();
    currentDate.setHours(0, 0, 0, 0); // Reset time to compare only dates
    return expiryDate > currentDate && month <= 12;
  }

  // Function to validate all inputs and update the indicator square
  function validateInputs() {
    const name = document.getElementById('name').value;
    const creditCard = document.getElementById('credit-card').value;
    const expiry = document.getElementById('expiry').value;
    const cvv = document.getElementById('cvv').value;
    const indicator = document.getElementById('indicator');

    if (name && validCreditCard(creditCard) && validExpiry(expiry) && cvv) {
      indicator.style.backgroundColor = 'green';
    } else {
      indicator.style.backgroundColor = 'red';
    }
  }
</script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="p-8 border border-gray-300 bg-white rounded shadow-lg">
  <div class="mb-4">
    <label class="block text-gray-700 text-sm mb-2" for="name">Name</label>
    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="name" type="text" placeholder="Name">
  </div>
  <div class="mb-4">
    <label class="block text-gray-700 text-sm mb-2" for="credit-card">Credit Card</label>
    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="credit-card" type="text" placeholder="Credit Card Number">
  </div>
  <div class="flex mb-4">
    <div class="mr-2">
      <label class="block text-gray-700 text-sm mb-2" for="expiry">Expiry</label>
      <input class="shadow appearance-none border rounded py-2 px-3 text-gray-700" id="expiry" type="text" placeholder="mm/yy">
    </div>
    <div>
      <label class="block text-gray-700 text-sm mb-2" for="cvv">CVV</label>
      <input class="shadow appearance-none border rounded py-2 px-3 text-gray-700" id="cvv" type="password" placeholder="CVV">
    </div>
  </div>
  <div class="mb-4 flex justify-between items-center">
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="button" onclick="validateInputs()">Validate</button>
    <div id="indicator" class="w-6 h-6 bg-orange-200 rounded-full"></div>
  </div>
</div>
</body>
</html>
