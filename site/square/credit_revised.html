<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Credit Card Validation</title>
<!-- Import Tailwind CSS from CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script>
  // Function to format the expiry input to include a slash
  function formatExpiryInput(event) {
    const input = event.target;
    let value = input.value.replace(/\D/g, ''); // Remove all non-digits

    // Add the slash if the length is at least 2 and not more than 4
    if (value.length >= 2 && value.length <= 4) {
        value = value.slice(0, 2) + '/' + value.slice(2);
    }

    // Fix for cursor position issue on backspace
    let selectionStart = input.selectionStart;
    let modifiedLength = value.length;

    input.value = value; // Set the new value

    // Adjust the cursor position after setting the new value
    if (event.inputType === "deleteContentBackward") {
        if (selectionStart === 3) { // If backspacing after the slash, move the cursor back one more space
        selectionStart--;
        }
        input.setSelectionRange(selectionStart, selectionStart);
    }
  }

  // Function to check if the credit card number is valid using the Luhn algorithm
  function validCreditCard(value) {
    // Remove all whitespaces from the input value
    value = value.replace(/\s+/g, '');
    
    // Check if the input is empty or contains any non-digit characters
    if (!value || /[^0-9]+/.test(value)) {
        return false;
    }

    let nCheck = 0, bEven = false;
    for (var n = value.length - 1; n >= 0; n--) {
        var cDigit = value.charAt(n),
            nDigit = parseInt(cDigit, 10);
        if (bEven && (nDigit *= 2) > 9) nDigit -= 9;
        nCheck += nDigit;
        bEven = !bEven;
    }

    return (nCheck % 10) === 0;
  }

  // Function to check if the expiry date is in the future
  function validExpiry(expiry) {
    const [month, year] = expiry.split('/');
    if (!month || !year || month.length !== 2 || year.length !== 2) {
      return false;
    }
    const expiryDate = new Date(`20${year}`, month - 1);
    const currentDate = new Date();
    currentDate.setHours(0, 0, 0, 0); // Reset time to compare only dates
    return expiryDate > currentDate && month <= 12;
  }

  // Function to check if the CVV is a three-digit number
  function validCVV(cvv) {
    return /^\d{3}$/.test(cvv);
  }

  // Function to validate all inputs and update the indicator square and message
  function validateInputs() {
    const name = document.getElementById('name').value;
    const creditCard = document.getElementById('credit-card').value;
    const expiry = document.getElementById('expiry').value;
    const cvv = document.getElementById('cvv').value;
    const indicator = document.getElementById('indicator');
    const message = document.getElementById('validation-message');

    let errorMessage = '';
    if (!name) errorMessage = 'Name is required.';
    else if (!validCreditCard(creditCard)) errorMessage = 'Invalid credit card number.';
    else if (!validExpiry(expiry)) errorMessage = 'Expiry date is not valid or in the past.';
    else if (!validCVV(cvv)) errorMessage = 'CVV must be a three-digit number.';

    if (errorMessage) {
      indicator.style.backgroundColor = 'red';
      message.textContent = errorMessage;
      message.style.display = 'block';
    } else {
      indicator.style.backgroundColor = 'green';
      message.style.display = 'none';
    }
  }

  // Event listeners to trigger validation on user input
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('name').addEventListener('input', validateInputs);
    document.getElementById('credit-card').addEventListener('input', validateInputs);
    document.getElementById('cvv').addEventListener('input', validateInputs);
    const expiryInput = document.getElementById('expiry');
    expiryInput.addEventListener('input', formatExpiryInput);
    expiryInput.addEventListener('input', validateInputs);
  });
</script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="p-8 border border-gray-300 bg-white rounded shadow-lg" style="max-width: 500px; width: 100%;">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm mb-2" for="name">Name</label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="name" type="text" placeholder="Name">
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 text-sm mb-2" for="credit-card">Credit Card</label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="credit-card" type="text" placeholder="Credit Card Number">
    </div>
    <div class="flex mb-4 space-x-3">
      <div class="flex-1">
        <label class="block text-gray-700 text-sm mb-2" for="expiry">Expiry</label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="expiry" type="text" placeholder="mm/yy">
      </div>
      <div class="flex-1">
        <label class="block text-gray-700 text-sm mb-2" for="cvv">CVV</label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="cvv" type="password" placeholder="CVV">
      </div>
    </div>
    <div class="mb-4 flex justify-between items-center">
      <div id="indicator" class="w-6 h-6 bg-yellow-500 rounded-full"></div>
      <span id="validation-message" class="text-red-500 text-sm hidden"></span>
    </div>
  </div>
</body>
</html>
